[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/gen",
    "crates/oracle",
    "crates/implicit-predicates",
    "benches",
    "corpus",
    "test-support",
]
exclude = ["ffi-ref", "fuzz"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arezouski/implicit-predicates"
keywords = ["geometry", "predicates", "robust", "exact", "mesh"]
categories = ["mathematics", "algorithms"]

[workspace.dependencies]
implicit-predicates-core = { version = "0.0.2", path = "crates/core" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
