[package]
name = "implicit-predicates-gen"
description = "Code generator for exact geometric predicates over explicit and implicit points"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["mathematics", "algorithms", "development-tools"]
# Compiles the emitted code against the crates of the workspace, which the
# package does not hold.
exclude = ["tests/emitted_code.rs"]

[lints]
workspace = true

[[bin]]
name = "implicit-predicates-gen"
path = "src/main.rs"

[dependencies]
implicit-predicates-core.workspace = true
num-bigint = "0.5"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
