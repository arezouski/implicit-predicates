[package]
name = "indirect-predicates"
description = "Exact geometric predicates over explicit and implicit points"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["mathematics", "algorithms", "no-std"]
# The tests depend on workspace-only test infrastructure, so they are not
# part of the published package.
exclude = ["tests/"]

[features]
default = ["std"]
std = []

[dependencies]
indirect-predicates-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
indirect-predicates-corpus = { path = "../../corpus" }
indirect-predicates-oracle = { path = "../oracle" }
indirect-predicates-test-support = { path = "../../test-support" }
proptest = "1"
