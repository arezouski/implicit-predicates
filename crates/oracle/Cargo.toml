[package]
name = "implicit-predicates-oracle"
description = "Slow exact reference implementation used to test implicit-predicates"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
num-bigint = "0.5"

# `fork` and `timeout` pull in crates that do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
