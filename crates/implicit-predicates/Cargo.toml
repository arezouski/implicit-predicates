[package]
name = "implicit-predicates"
description = "Exact geometric predicates over explicit and implicit points"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["mathematics", "algorithms", "no-std"]
# The tests depend on workspace-only test infrastructure, so they are not
# part of the published package.
exclude = ["tests/"]

[features]
default = ["std"]
# The arena of each thread used by `orient3d`, `insphere` and `insphere_sos`.
std = ["implicit-predicates-core/alloc"]

[dependencies]
implicit-predicates-core.workspace = true

[lints]
workspace = true

[dev-dependencies]
implicit-predicates-corpus = { path = "../../corpus" }
implicit-predicates-oracle = { path = "../oracle" }
implicit-predicates-test-support = { path = "../../test-support" }

# `fork` and `timeout` pull in crates that do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
