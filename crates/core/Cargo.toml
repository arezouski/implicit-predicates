[package]
name = "implicit-predicates-core"
description = "Arithmetic building blocks for exact geometric predicates: the no_std core of implicit-predicates"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories = ["mathematics", "algorithms", "no-std"]
# The tests depend on workspace-only test infrastructure, so they are not
# part of the published package.
exclude = ["tests/"]

[features]
# An owned, growable arena: `Scratch::growable`.
alloc = []

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dev-dependencies]
implicit-predicates-oracle = { path = "../oracle" }
implicit-predicates-test-support = { path = "../../test-support" }
proptest = "1"
