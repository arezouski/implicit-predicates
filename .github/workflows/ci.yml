name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly long property run.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  generated:
    # The committed generated code must be what the generator produces. The
    # text is formatted by rustfmt, so this uses the same toolchain as `fmt`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: >-
          cargo run -p implicit-predicates-gen --
          crates/implicit-predicates/predicates
          --stages crates/implicit-predicates/src/generated
          --checks crates/implicit-predicates/tests/generated
          --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --release
      - run: cargo bench -p implicit-predicates-benches --no-run

  test-fma:
    # The x86_64 fused multiply-add path is compiled only with the `fma`
    # target feature, which GitHub's x86_64 runners support.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+fma
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --release

  long-properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: -D warnings
          - os: ubuntu-latest
            rustflags: -D warnings -C target-feature=+fma
          - os: ubuntu-24.04-arm
            rustflags: -D warnings
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      PROPTEST_CASES: 200000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --release

  fuzz:
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run each target
        working-directory: fuzz
        run: |
          for target in orient3d insphere insphere_sos point_check; do
            cargo fuzz run "$target" -- -max_total_time=300
          done
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - run: cargo check --workspace
      - run: cargo check --workspace --all-features --all-targets

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - run: cargo build -p implicit-predicates-core --target thumbv7em-none-eabihf
      - run: cargo build -p implicit-predicates --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p implicit-predicates --no-default-features --target wasm32-unknown-unknown
      - run: cargo build -p implicit-predicates --target wasm32-unknown-unknown
      - run: cargo build -p implicit-predicates-core --features alloc --target wasm32-unknown-unknown
      # The tests of the crate without its `std` feature, on the host.
      - run: cargo test -p implicit-predicates --no-default-features

  wasm:
    # The tests that compare against the exact reference, on wasm32 under
    # wasmtime: this runs the guards for a 32-bit `usize`. The directory is
    # preopened so that the versioned corpus samples can be read. Panics
    # abort on wasm32, so the `#[should_panic]` tests are reported as
    # ignored there.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install wasmtime
        run: |
          version=v50.0.1
          name="wasmtime-$version-x86_64-linux"
          mkdir -p "$RUNNER_TEMP/wasmtime"
          cd "$RUNNER_TEMP/wasmtime"
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/$version/$name.tar.xz" | tar -xJ
          echo "$RUNNER_TEMP/wasmtime/$name" >> "$GITHUB_PATH"
      - run: wasmtime --version
      - run: cargo test -p implicit-predicates-core --all-features --target wasm32-wasip1
      - run: cargo test -p implicit-predicates --all-features --target wasm32-wasip1

  reference:
    # The bindings to the third-party reference libraries, outside the
    # workspace. The sources are downloaded at pinned commits; no model is
    # downloaded and no corpus is generated. The libraries are built with
    # AVX2 and FMA, which GitHub's x86_64 runners support.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: c++ --version
      - run: python3 -m unittest discover corpus/tools/tests
      - run: python3 corpus/tools/corpus.py fetch-reference
      - run: cargo test --manifest-path ffi-ref/Cargo.toml
      - run: cargo bench --manifest-path ffi-ref/Cargo.toml --no-run

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
      - run: cargo doc --workspace --no-deps --all-features
      - run: cargo doc -p implicit-predicates --no-deps --no-default-features
