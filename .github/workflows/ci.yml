name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly long property run.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --release
      - run: cargo bench -p indirect-predicates-benches --no-run

  test-fma:
    # The x86_64 fused multiply-add path is compiled only with the `fma`
    # target feature, which GitHub's x86_64 runners support.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -C target-feature=+fma
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --all-features --release

  long-properties:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rustflags: -D warnings
          - os: ubuntu-latest
            rustflags: -D warnings -C target-feature=+fma
          - os: ubuntu-24.04-arm
            rustflags: -D warnings
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      PROPTEST_CASES: 200000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --release

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - run: cargo check --workspace
      - run: cargo check --workspace --all-features --all-targets

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - run: cargo build -p indirect-predicates-core --target thumbv7em-none-eabihf
      - run: cargo build -p indirect-predicates --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p indirect-predicates --target wasm32-unknown-unknown
      - run: cargo build -p indirect-predicates-core --features alloc --target wasm32-unknown-unknown

  reference:
    # The bindings to the third-party reference libraries, outside the
    # workspace. The sources are downloaded at pinned commits; no model is
    # downloaded and no corpus is generated. The libraries are built with
    # AVX2 and FMA, which GitHub's x86_64 runners support.
    runs-on: ubuntu-latest
    # Non-blocking until it has run green once: it compiles third-party code
    # whose behaviour depends on the compiler of the runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: c++ --version
      - run: python3 -m unittest discover corpus/tools/tests
      - run: python3 corpus/tools/corpus.py fetch-reference
      - run: cargo test --manifest-path ffi-ref/Cargo.toml
      - run: cargo bench --manifest-path ffi-ref/Cargo.toml --no-run

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
      - run: cargo doc --workspace --no-deps --all-features
