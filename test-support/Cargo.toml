[package]
name = "implicit-predicates-test-support"
description = "Shared test infrastructure for the implicit-predicates workspace: input generators, exact checks and proptest configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
implicit-predicates-core = { path = "../crates/core" }
implicit-predicates-oracle = { path = "../crates/oracle" }

# `fork` and `timeout` pull in crates that do not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
