[package]
name = "indirect-predicates-benches"
description = "Benchmarks for the arithmetic core of indirect-predicates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
indirect-predicates = { path = "../crates/indirect-predicates" }
indirect-predicates-core = { path = "../crates/core" }
indirect-predicates-corpus = { path = "../corpus" }
geometry-predicates = "0.3.0"
robust = "1.2.0"

[dev-dependencies]
indirect-predicates-oracle = { path = "../crates/oracle" }
indirect-predicates-test-support = { path = "../test-support" }
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "eft"
harness = false

[[bench]]
name = "expansion"
harness = false

[[bench]]
name = "det3"
harness = false

[[bench]]
name = "predicates"
harness = false

[[bench]]
name = "orient3d_stages"
harness = false
